name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate --config prisma7.config.ts
      - run: npm run lint
      - run: npm run build
      - run: docker pull postgres:18
      - run: npm test
