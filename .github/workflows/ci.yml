name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v7
      - name: Generate temporary encryption key
        run: echo "APP_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: docker pull postgres:18
      - run: npm test

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image name
        id: image
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag=latest
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            tag=dev
          else
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" == v[0-9]* ]]; then
              tag="${tag#v}"
            fi
          fi
          if [[ ${#tag} -gt 128 || ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]; then
            echo "Git tag cannot be used as a Docker image tag: $tag" >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
